<body><form id="lf"><h1>TEEB</h1><p style="color:#7f8fb0;margin:0">Log in to your MEGA. Your data and TEEB's own code live there.</p>
<input type="email" id="e" autocomplete="username" placeholder="MEGA email" required><input type="password" id="p" autocomplete="current-password" placeholder="MEGA password" required><label><input type="checkbox" onchange="document.getElementById('p').type=this.checked?'text':'password'"> Show password</label>
<label>Stay logged in <select id="stay"><option value="0">No</option><option value="300000">5 minutes</option><option value="3600000">1 hour</option><option value="86400000">1 day</option><option value="2592000000">30 days</option></select></label><label><input type="checkbox" id="r"> Reset TEEB to the built-in version</label><button type="submit">Log in</button><p id="m"></p></form>

<script>
/* TEEB loader: log in to MEGA, load TEEB's core code from MEGA (teeb-core.json), run it.
   This file rarely needs re-uploading: edit the core from Developer mode inside the app. */
const DEFAULT_CORE = {"v": 9, "custom": false, "css": "\n/* ===== TEEB \u00b7 Phase 1 \u00b7 styles ===== */\n:root{--bg:#060912;--glass:rgba(150,185,255,.07);--line:rgba(150,200,255,.18);--ice:#4da3ff;--amber:#35d07f;--tx:#e6eefc;--mute:#7f8fb0;--red:#ff4d5e}\n*{box-sizing:border-box;margin:0}\nbody{font:400 15px/1.5 Sora,'Segoe UI',system-ui,sans-serif;color:var(--tx);background:radial-gradient(1200px 700px at 70% -10%,#12244a 0,var(--bg) 60%) fixed;min-height:100vh;display:flex}\nnav{width:200px;padding:24px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;backdrop-filter:blur(14px);background:var(--glass)}\nnav h1{font-weight:600;font-size:26px;letter-spacing:.18em;color:var(--ice);padding:0 10px 18px}\nnav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;color:var(--mute);transition:.2s}\nnav button:hover{color:var(--tx)}nav button.on{background:var(--glass);color:var(--ice);box-shadow:inset 2px 0 var(--amber)}\nmain{flex:1;padding:28px;max-width:900px}\nsection{display:none}section.on{display:block}\nh2{font-weight:300;font-size:28px;margin-bottom:16px}\n.g{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(12px)}\n.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}\ninput,select,textarea{font:inherit;color:var(--tx);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}\ninput[type=text]{flex:1}\n.b{all:unset;cursor:pointer;padding:9px 14px;border-radius:10px;border:1px solid var(--line);color:var(--ice);transition:.2s}\n.b:hover,.b:focus-visible{background:var(--glass);border-color:var(--ice)}.b.hot{background:var(--amber);color:#04140a;border-color:var(--amber)}\n.item{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}\n.item span.t{flex:1}.item.done .t{text-decoration:line-through;color:var(--mute)}\n.n{color:var(--mute);width:26px}.pr-high{color:var(--red)}.pr-medium{color:var(--amber)}.pr-low{color:var(--mute)}\nnav h1{background:linear-gradient(90deg,#4da3ff,#35d07f,#ff4d5e);-webkit-background-clip:text;background-clip:text;color:transparent}\n.g{box-shadow:0 8px 30px rgba(0,0,0,.28)}.b{transition:.2s}.b:active{transform:scale(.96)}\n@media(min-width:1800px){body{font-size:21px}main{max-width:1300px}}\n/* HUD: the one loud element */\n.hud{width:220px;height:220px;position:relative;margin:8px auto 20px;cursor:pointer}\n.hud i{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--ice);opacity:.7}\n.hud i:nth-child(1){border-style:dashed;animation:sp 26s linear infinite}\n.hud i:nth-child(2){inset:22px;border-color:var(--amber);border-top-color:transparent;border-bottom-color:transparent;animation:sp 9s linear infinite reverse}\n.hud i:nth-child(3){inset:48px;border-width:3px;border-left-color:transparent;animation:sp 5s linear infinite}\n.hud b{position:absolute;inset:78px;border-radius:50%;background:radial-gradient(var(--ice),transparent 70%);opacity:.35;transition:.3s}\n.hud.live b{opacity:1;animation:pu 1.2s ease-in-out infinite}.hud.mute i{filter:grayscale(1);opacity:.3}\n@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{50%{transform:scale(1.25)}}\n.log{max-height:240px;overflow:auto;color:var(--mute);font-size:13px}.log p{padding:3px 0}.log em{color:var(--amber);font-style:normal}\n.stat{display:flex;gap:12px;margin:16px 0}.stat div{flex:1}.stat big{display:block;font-size:30px;font-weight:300;color:var(--ice)}\nlabel{display:block;color:var(--mute);font-size:13px;margin:12px 0 4px}\n#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0d1a33;border:1px solid var(--ice);padding:8px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}\n@media(max-width:700px){body{flex-direction:column;padding-bottom:64px}nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:5;background:#0a1226}nav h1{display:none}nav button{padding:8px 9px;font-size:12px}main{padding:18px 16px}}\n#heard{color:var(--mute);font-size:13px;min-height:1.3em;margin-bottom:8px}#ans{margin-bottom:16px;line-height:1.6}#ans[hidden]{display:none}#ans a{color:var(--ice);font-size:12px;display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n#ov{position:fixed;inset:0;z-index:30;background:rgba(4,8,18,.96);display:grid;place-items:center;text-align:center}#ov.off{display:none}#ov h1{font-weight:300;font-size:34px;margin:8px 0 24px}\n[hidden]{display:none!important}\n#lock{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg)}#lock.off{display:none}#lf{width:min(360px,90vw);display:flex;flex-direction:column;gap:12px}#lf h1{font-weight:600;letter-spacing:.18em;color:var(--ice)}#lM{color:var(--amber);min-height:1.4em;font-size:13px}\n@media(prefers-reduced-motion:reduce){*{animation:none!important}}\n", "body": "<div id=\"lock\" class=\"off\"><form id=\"lf\" class=\"g\"><h1>TEEB<\/h1><p style=\"color:var(--mute)\">Log in to your MEGA account. Your data lives there, encrypted, and nowhere else.<\/p><input type=\"email\" id=\"lE\" autocomplete=\"username\" placeholder=\"MEGA email\" required><input type=\"password\" id=\"lP\" autocomplete=\"current-password\" placeholder=\"MEGA password\" required><button class=\"b hot\" type=\"submit\">Log in<\/button><p id=\"lM\"><\/p><\/form><\/div>\n<div id=\"ov\" class=\"off\"><\/div>\n<nav id=\"nav\"><h1>TEEB<\/h1><\/nav>\n<main>\n<p id=\"heard\"><\/p>\n<div class=\"g\" id=\"ans\" hidden><\/div>\n<section id=\"home\">\n  <h2 id=\"greet\">Hey.<\/h2>\n  <div class=\"hud\" id=\"hud\" role=\"button\" tabindex=\"0\" aria-label=\"Toggle listening\"><i><\/i><i><\/i><i><\/i><b><\/b><\/div>\n  <div class=\"row\" style=\"justify-content:center\"><span id=\"status\" style=\"color:var(--mute)\">Idle<\/span><\/div>\n  <div class=\"stat g\"><div><big id=\"sN\">0<\/big>notes<\/div><div><big id=\"sT\">0<\/big>open tasks<\/div><div><big id=\"sD\">Local<\/big>storage<\/div><\/div>\n  <div class=\"g\"><div class=\"row\"><button class=\"b hot\" id=\"drvBtn\">Log in to MEGA<\/button><span style=\"color:var(--mute)\">Notes, tasks and settings are saved to teeb-data.json in your MEGA.<\/span><\/div><\/div>\n<\/section>\n<section id=\"messages\"><h2>Messages<\/h2><div class=\"g\" id=\"thread\" style=\"min-height:220px;max-height:48vh;overflow:auto\"><\/div>\n<div class=\"row\" style=\"margin-top:10px\"><input type=\"text\" id=\"mIn\" placeholder=\"Message TEEB\"><button class=\"b hot\" id=\"mGo\">Send<\/button><\/div>\n<h2 style=\"font-size:18px;margin:18px 0 6px\">Schedule a text<\/h2><div class=\"row g\"><input type=\"text\" id=\"fFrom\" placeholder=\"From (e.g. Mum)\" style=\"max-width:130px\"><input type=\"text\" id=\"fTxt\" placeholder=\"Message\"><input type=\"datetime-local\" id=\"fAt\"><button class=\"b\" id=\"fAdd\">Schedule<\/button><\/div><\/section>\n<section id=\"planner\"><h2>Planner<\/h2><div class=\"row g\"><input type=\"text\" id=\"pT\" placeholder=\"Name\"><input type=\"datetime-local\" id=\"pAt\"><select id=\"pK\"><option value=\"alarm\">Alarm<\/option><option value=\"event\">Calendar event<\/option><option value=\"call\">Fake call<\/option><\/select><button class=\"b hot\" id=\"pAdd\">Add<\/button><\/div>\n<div class=\"g\" id=\"pList\" style=\"margin-top:12px\"><\/div><p style=\"color:var(--mute);font-size:13px;margin-top:8px\">Alarms, fake calls and texts fire while TEEB is open. For a guaranteed alarm, tap \u201cPhone clock\u201d. For events, tap \u201cAdd to calendar\u201d.<\/p><\/section>\n<section id=\"apps\"><h2>Apps<\/h2><div class=\"g\" id=\"aList\"><\/div>\n<div class=\"row g\" style=\"margin-top:12px\"><input type=\"text\" id=\"aN\" placeholder=\"App name\"><input type=\"text\" id=\"aP\" placeholder=\"Package name (the id= part of its Play Store link)\"><button class=\"b\" id=\"aAdd\">Add app<\/button><\/div>\n<div class=\"row g\" style=\"margin-top:12px\"><input type=\"text\" id=\"shT\" placeholder=\"Text to send\"><button class=\"b hot\" id=\"shGo\">Share to any app<\/button><\/div>\n<p style=\"color:var(--mute);font-size:13px;margin-top:8px\">Opens apps and sends them text. Say \u201copen TikTok\u201d or \u201cwhatsapp +254700000000 hello\u201d. TEEB can't read what's inside other apps.<\/p><\/section>\n<section id=\"studio\"><h2>Studio<\/h2>\n<div class=\"g\"><b>Draw<\/b><div class=\"row\" style=\"margin-top:8px\"><input type=\"text\" id=\"sdP\" placeholder=\"Describe a picture\"><button class=\"b hot\" id=\"sdGo\">Draw<\/button><\/div><img id=\"sdImg\" style=\"max-width:100%;border-radius:12px;margin-top:8px\" hidden><\/div>\n<div class=\"g\" style=\"margin-top:12px\"><b>Describe a picture<\/b><div class=\"row\" style=\"margin-top:8px\"><input type=\"file\" id=\"svF\" accept=\"image/*\"><input type=\"text\" id=\"svQ\" placeholder=\"Ask about it (optional)\"><button class=\"b hot\" id=\"svGo\">Look<\/button><button class=\"b\" id=\"scGo\">Look at my screen<\/button><\/div><p id=\"svA\" style=\"margin-top:8px\"><\/p><\/div>\n<div class=\"g\" style=\"margin-top:12px\"><b>Translate<\/b><div class=\"row\" style=\"margin-top:8px\"><input type=\"text\" id=\"trT\" placeholder=\"Text\"><select id=\"trL\"><option>french<\/option><option>spanish<\/option><option>portuguese<\/option><option>german<\/option><option>swahili<\/option><option>zulu<\/option><option>afrikaans<\/option><option>arabic<\/option><option>chinese<\/option><option>hindi<\/option><option>english<\/option><\/select><button class=\"b hot\" id=\"trGo\">Translate<\/button><\/div><p id=\"trA\" style=\"margin-top:8px\"><\/p><\/div>\n<div class=\"g\" style=\"margin-top:12px\"><b>Read a document<\/b> <small style=\"color:var(--mute)\">text, notes, CSV, PDF<\/small><div class=\"row\" style=\"margin-top:8px\"><input type=\"file\" id=\"dcF\" accept=\".txt,.md,.csv,.json,.html,.pdf\"><input type=\"text\" id=\"dcQ\" placeholder=\"Ask about it, or leave empty to summarise\"><button class=\"b hot\" id=\"dcGo\">Read<\/button><\/div><p id=\"dcA\" style=\"margin-top:8px;white-space:pre-wrap\"><\/p><\/div>\n<div class=\"g\" style=\"margin-top:12px\"><b>Write or research<\/b><div class=\"row\" style=\"margin-top:8px\"><input type=\"text\" id=\"wrP\" placeholder=\"e.g. a one-page report on solar power\"><button class=\"b hot\" id=\"wrGo\">Write<\/button><button class=\"b\" id=\"rsGo\">Deep research<\/button><\/div><textarea id=\"wrT\" rows=\"9\" style=\"width:100%;margin-top:8px\"><\/textarea><div class=\"row\" style=\"margin-top:8px\"><button class=\"b\" id=\"wrDl\">Download as Word file<\/button><\/div><\/div>\n<div class=\"g\" style=\"margin-top:12px\"><b>Luno price + paper trading<\/b> <small style=\"color:var(--mute)\">pretend money only, no real orders<\/small><div class=\"row\" style=\"margin-top:8px\"><select id=\"lnP\"><option>XBTZAR<\/option><option>ETHZAR<\/option><option>XBTUSDT<\/option><option>XBTNGN<\/option><option>XBTEUR<\/option><\/select><button class=\"b\" id=\"lnGo\">Get price<\/button><input type=\"text\" id=\"lnA\" placeholder=\"Amount to trade (money)\" style=\"max-width:190px\"><button class=\"b hot\" id=\"lnB\">Paper buy<\/button><button class=\"b\" id=\"lnS\">Paper sell<\/button><\/div><p id=\"lnO\" style=\"margin-top:8px\"><\/p><\/div><\/section>\n<section id=\"developer\"><h2>Developer mode<\/h2>\n<div id=\"devLock\" class=\"g\"><p style=\"color:var(--mute)\">Enter your MEGA password to unlock.<\/p><div class=\"row\"><input type=\"password\" id=\"dPw\" autocomplete=\"current-password\" placeholder=\"MEGA password\"><button class=\"b hot\" id=\"dGo\">Unlock<\/button><\/div><\/div>\n<div id=\"devBox\" hidden><div class=\"row\"><button class=\"b\" id=\"dLock\">Lock<\/button><\/div>\n<label>Upgrade name<\/label><input type=\"text\" id=\"dName\" style=\"width:100%\"><label>Code (globals: DB, Mem, speak, toast, run, $, show)<\/label><textarea id=\"dCode\" rows=\"10\" style=\"width:100%;font-family:monospace\"><\/textarea>\n<div class=\"row\" style=\"margin-top:8px\"><button class=\"b hot\" id=\"dInst\">Install<\/button><button class=\"b\" id=\"dAsk\">Draft with AI<\/button><\/div>\n<h2 style=\"font-size:18px;margin:18px 0 6px\">Installed upgrades<\/h2><div class=\"g\" id=\"dList\"><\/div>\n<h2 style=\"font-size:18px;margin:18px 0 6px\">TEEB core code<\/h2><p style=\"color:var(--mute);font-size:13px\">This edits TEEB itself. It saves to your MEGA and applies after a reload, on the website and the app.<\/p>\n<div class=\"row\"><select id=\"cPart\"><option value=\"js\">Script<\/option><option value=\"body\">Page HTML<\/option><option value=\"css\">Styles<\/option><\/select><button class=\"b\" id=\"cLoad\">Load<\/button><button class=\"b hot\" id=\"cSave\">Save and reload<\/button><button class=\"b\" id=\"cReset\">Reset to built-in<\/button><\/div>\n<textarea id=\"cCode\" rows=\"14\" style=\"width:100%;font-family:monospace;margin-top:8px\"><\/textarea><\/div><\/section>\n<section id=\"memory\">\n  <h2>Memory<\/h2>\n  <div class=\"row g\"><input type=\"text\" id=\"nIn\" placeholder=\"Write a note\"><button class=\"b hot\" id=\"nAdd\">Save note<\/button><\/div>\n  <div class=\"row\" style=\"margin:12px 0\"><input type=\"text\" id=\"nQ\" placeholder=\"Search notes\"><\/div>\n  <div class=\"g\" id=\"nList\"><\/div>\n<\/section>\n<section id=\"tasks\">\n  <h2>Tasks<\/h2>\n  <div class=\"row g\"><input type=\"text\" id=\"tIn\" placeholder=\"Add a task\"><select id=\"tPr\"><option>high<\/option><option selected>medium<\/option><option>low<\/option><\/select><button class=\"b hot\" id=\"tAdd\">Add task<\/button><\/div>\n  <div class=\"g\" id=\"tList\" style=\"margin-top:12px\"><\/div>\n<\/section>\n<section id=\"voice\">\n  <h2>Voice console<\/h2>\n  <div class=\"row g\"><button class=\"b hot\" id=\"ptt\">Tap to talk<\/button><button class=\"b\" id=\"listenBtn\">Start listening<\/button><button class=\"b\" id=\"muteBtn\">Mute TEEB<\/button><\/div>\n  <div class=\"row g\" style=\"margin-top:12px\"><input type=\"text\" id=\"cmdIn\" placeholder=\"Or type a command: teeb add task call mum\"><button class=\"b\" id=\"cmdGo\">Run<\/button><\/div>\n  <h2 style=\"font-size:18px;margin:18px 0 6px\">Command history<\/h2>\n  <div class=\"g log\" id=\"log\"><\/div>\n  <p style=\"color:var(--mute);font-size:13px;margin-top:10px\">Try: \u201cTEEB save note \u2026\u201d, \u201cshow notes\u201d, \u201csearch notes \u2026\u201d, \u201cadd task \u2026 high priority\u201d, \u201ccomplete task 2\u201d, \u201cdelete task 1\u201d, \u201cpriority task 2 low\u201d.<\/p>\n<\/section>\n<section id=\"settings\">\n  <h2>Settings<\/h2>\n  <div class=\"g\">\n    <label>What should TEEB call you?<\/label><input type=\"text\" id=\"sName\" style=\"width:100%\">\n    <label>TEEB's personality<\/label><select id=\"sTone\"><option value=\"friend\">Playful friend<\/option><option value=\"chill\">Chill and friendly<\/option><option value=\"sharp\">Short and sharp<\/option><\/select>\n    <label>Wake words (comma separated: add what your phone hears)<\/label><input type=\"text\" id=\"sWake\" style=\"width:100%\"><label><input type=\"checkbox\" id=\"sAll\"> Answer everything I say, no wake word needed<\/label>\n<label>AI keys: TEEB tries each one you fill in, in order, until one answers (model box is optional)<\/label><label>Installed upgrades<\/label><div id=\"mods\"><\/div>\n<label><input type=\"checkbox\" id=\"sCouncil\"> Ask every AI at once and combine the best answer<\/label><div id=\"keys\"><\/div>\n<label>Voice speed <span id=\"vsv\"><\/span><\/label><input type=\"range\" id=\"sRate\" min=\".6\" max=\"1.6\" step=\".1\" style=\"width:100%\">\n    <label>Voice<\/label><select id=\"sVoice\" style=\"width:100%\"><\/select>\n    <label>Theme<\/label><select id=\"sTheme\"><option value=\"ice\">Ice<\/option><option value=\"amber\">Amber<\/option><option value=\"violet\">Violet<\/option><\/select>\n    <label>Wake word sensitivity <span id=\"wsv\"><\/span><\/label><input type=\"range\" id=\"sSens\" min=\".1\" max=\".9\" step=\".1\" style=\"width:100%\">\n    <div class=\"row\" style=\"margin-top:16px\"><button class=\"b\" id=\"sTest\">Test voice<\/button><button class=\"b\" id=\"signOut\">Log out of MEGA<\/button><\/div>\n  <\/div>\n<\/section>\n<\/main>\n<div id=\"toast\"><\/div>", "js": "\n/* ===== TEEB \u00b7 Phase 1 \u00b7 script ===== */\n/* 1) CONFIG \u2014 storage is MEGA only. Nothing is written to localStorage, cookies or any other cloud. */\nconst FILE = 'teeb-data.json';\nconst WAKE = ['teeb','tebe','tib','tibe','teab','tebb','tieb','t b','tee b','deeb'];\nconst $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2600); };\n\n/* 2) MEMORY SYSTEM \u2014 notes, tasks, research, settings, conversations. Saved to teeb-data.json in MEGA. */\nconst blank = () => ({notes:[], tasks:[], research:[], conversations:[], apps:[], plans:[], thread:[], mods:[], settings:{name:'', tone:'friend', rate:1, voice:'', theme:'ice', sens:.5}});\nlet DB = blank(), storage = null, remote = null, saveTimer = null, saving = false, dirty = false;\nconst uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);\nconst Mem = {\n  save(sec, item){ item.id = uid(); item.at = Date.now(); DB[sec].push(item); persist(); return item; },\n  load(sec){ return DB[sec]; },\n  edit(sec, i, patch){ const it = DB[sec][i]; if (!it) return null; Object.assign(it, patch); persist(); return it; },\n  del(sec, i){ const it = DB[sec][i]; if (!it) return null; DB[sec].splice(i, 1); persist(); return it; }\n};\nfunction persist(){ dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(pushMega, 1000); renderAll(); }\n\n/* 3) MEGA \u2014 login, load, save (uses the open-source megajs library; MEGA encrypts client-side) */\nasync function megaLogin(email, password){\n  if (!window.mega) throw new Error('Could not load the MEGA library. Check your connection.');\n  storage = await new mega.Storage({email, password}).ready; await megaLoad();\n}\nasync function megaLoad(){\n  remote = storage.root.children.find(f => f.name === FILE && !f.directory) || null;\n  if (remote) { const buf = await remote.downloadBuffer(); DB = Object.assign(blank(), JSON.parse(new TextDecoder().decode(buf))); }\n  else { dirty = true; await pushMega(); }\n  try { // daily backup, last 7 kept\n    const bn = 'teeb-backup-' + new Date().toISOString().slice(0, 10) + '.json', bs = storage.root.children.filter(f => /^teeb-backup-/.test(f.name)).sort((a, b) => a.name < b.name ? -1 : 1);\n    const have = bs.some(f => f.name === bn); if (!have) await storage.upload(bn, JSON.stringify(DB)).complete;\n    while (bs.length > (have ? 7 : 6)) await bs.shift().delete(true);\n  } catch(e){ console.warn('backup', e); }\n}\nasync function pushMega(){\n  if (!storage) return;\n  if (saving) { dirty = true; return; }\n  saving = true; dirty = false;\n  try {\n    const old = remote;\n    const up = storage.upload(FILE, JSON.stringify(DB));\n    remote = await up.complete;\n    if (old) await old.delete(true);\n  } catch(e){ console.warn(e); toast('MEGA save failed. Will retry on your next change.'); dirty = true; }\n  saving = false;\n  if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(pushMega, 1500); }\n}\n\n/* 4) PERSONALITY \u2014 the same events, three voices. Pick yours in Settings. */\nconst VOICE = {\n  friend:{hi:n=>`Yo${n?' '+n:''}! Good to see you. What are we getting into?`, yes:'I\\'m all ears, my friend.', note:'Locked in. I\\'ve got it, no stress.', nfound:'Hmm, came up empty. Want to try different words?', task:t=>'On the list. You\\'ve got this.', done:'Boom, one down. Proud of you.', gone:'Gone. Poof.', pri:'Priority shuffled.', none:'Sorry, I missed that one. Say it again for me?', cnt:(a,b)=>`${a} notes and ${b} open tasks. We\\'re doing alright.`},\n  chill:{hi:n=>`Hey${n?' '+n:''}, good to see you.`, yes:\"I'm here.\", note:\"Got it, note's saved.\", nfound:\"Couldn't find anything on that.\", task:t=>\"Task added.\", done:'Nice one, marked done.', gone:'All removed.', pri:'Priority changed.', none:\"Hmm, I missed that. Say it again?\", cnt:(a,b)=>`You've got ${a} notes and ${b} open tasks.`},\n  sharp:{hi:n=>`${n?n+'. ':''}Ready.`, yes:'Go.', note:'Note saved.', nfound:'No match.', task:t=>'Task added.', done:'Done.', gone:'Deleted.', pri:'Updated.', none:'Unrecognized.', cnt:(a,b)=>`${a} notes. ${b} open tasks.`}\n};\nconst P = () => VOICE[DB.settings.tone] || VOICE.friend;\nconst who = () => DB.settings.name || '';\n\n/* 5) COMMAND ENGINE */\nconst logEl = $('log');\nfunction logLine(kind, text){ const p = document.createElement('p'); p.innerHTML = `<em>${kind}<\/em> ${esc(text)}`; logEl.prepend(p); }\nlet speaking = false, spTok = 0;\nfunction speak(text){\n  logLine('TEEB', text); DB.thread.push({who:'teeb', text, at: Date.now()}); DB.thread = DB.thread.slice(-100); renderThread(); DB.conversations.push({id: uid(), at: Date.now(), text}); DB.conversations = DB.conversations.slice(-100);\n  if (muted || !window.speechSynthesis) return;\n  const u = new SpeechSynthesisUtterance(text); u.rate = +DB.settings.rate || 1;\n  const v = speechSynthesis.getVoices().find(v => v.name === DB.settings.voice); if (v) u.voice = v;\n  const tok = ++spTok; speaking = true; try { rec && rec.abort(); } catch(e){}\n  const done = () => { if (tok !== spTok || !speaking) return; speaking = false; if (listening) setTimeout(beginRec, 300); };\n  u.onend = done; u.onerror = done; setTimeout(done, Math.min(45000, text.length * 90 + 3000));\n  speechSynthesis.cancel(); speechSynthesis.speak(u);\n}\nconst pickTask = ref => { ref = ref.trim(); if (/^\\d+$/.test(ref)) return +ref - 1; return DB.tasks.findIndex(t => t.text.toLowerCase().includes(ref)); };\nasync function aiText(q){ const ks = DB.settings.keys || {}; let err; for (const p of PROVIDERS.filter(x => ks[x.id] || x.nokey)) { try { const o = await (p.ask || askOA)(q, {key: ks[p.id] || '', model: (DB.settings.models || {})[p.id] || p.model}, p); if (o.text) return o.text; } catch(e){ err = e; } } throw err || new Error('No AI is set up. Add a key in Settings or switch on Cloudflare AI.'); }\nconst dl = (name, text, mime) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'})); a.download = name; a.click(); };\nasync function pdfText(buf){ if (!window.pdfjsLib) { await new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; sc.onload = ok; sc.onerror = () => no(new Error('Could not load the PDF reader.')); document.head.appendChild(sc); }); const w = await (await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')).text(); pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([w], {type: 'text/javascript'})); }\n  const d = await pdfjsLib.getDocument({data: buf}).promise; let t = ''; for (let i = 1; i <= Math.min(d.numPages, 40); i++) { const c = await (await d.getPage(i)).getTextContent(); t += c.items.map(x => x.str).join(' ') + '\\n'; } return t; }\nasync function deepResearch(topic){\n  const plan = await aiText('List 4 short web search queries (max 6 words each), one per line, no numbering, that together would research: ' + topic);\n  const qs = plan.split('\\n').map(x => x.replace(/^[\\d.\\-*\\s]+/, '').trim()).filter(Boolean).slice(0, 4); if (!qs.length) qs.push(topic);\n  let ctx = ''; for (const q of qs) { try { const c = await webContext(q); if (c.text) ctx += '\\n## ' + q + '\\n' + c.text.slice(0, 3000); } catch(e){} }\n  return aiText('Write a clear, well-organised research report on: ' + topic + '. Use headings, short paragraphs, and a brief conclusion. Plain text with no markdown symbols. Say when something is uncertain.\\n\\nSearch results to use:\\n' + ctx.slice(0, 14000));\n}\nasync function makeDoc(deep){ const p = $('wrP').value.trim(); if (!p) return toast('Say what to write first'); $('wrT').value = deep ? 'Researching\u2026 this can take a minute.' : 'Writing\u2026';\n  try { $('wrT').value = deep ? await deepResearch(p) : await aiText('Write this as a complete, well-structured document with a title and headings. Plain text with no markdown symbols. Request: ' + p); } catch(e){ $('wrT').value = ''; toast(e.message); } }\n$('wrGo').onclick = () => makeDoc(false); $('rsGo').onclick = () => makeDoc(true);\n$('wrDl').onclick = () => { const t = $('wrT').value; if (!t.trim()) return toast('Nothing to download yet'); dl('TEEB-document.doc', '<html><head><meta charset=\"utf-8\"><\/head><body style=\"font-family:Calibri,sans-serif\">' + esc(t).replace(/\\n/g, '<br>') + '<\\/body><\\/html>', 'application/msword'); };\n$('dcGo').onclick = async () => { const f = $('dcF').files[0]; if (!f) return toast('Pick a file first'); $('dcA').textContent = 'Reading\u2026';\n  try { const txt = /\\.pdf$/i.test(f.name) ? await pdfText(await f.arrayBuffer()) : await f.text(); if (!txt.trim()) throw new Error('I could not find any text in that file.');\n    const a = await aiText('Here is a document called \"' + f.name + '\":\\n\\n' + txt.slice(0, 18000) + '\\n\\n' + ($('dcQ').value.trim() || 'Summarise it clearly with the key points.')); $('dcA').textContent = a; speak(a.slice(0, 400)); } catch(e){ $('dcA').textContent = ''; toast(e.message); } };\nasync function screenLook(q){ const st = await navigator.mediaDevices.getDisplayMedia({video: true}), v = document.createElement('video'); v.srcObject = st; await v.play(); await new Promise(r => setTimeout(r, 500)); const k = Math.min(1, 640 / v.videoWidth), c = document.createElement('canvas'); c.width = v.videoWidth * k; c.height = v.videoHeight * k; c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); st.getTracks().forEach(t => t.stop());\n  const b = atob(c.toDataURL('image/jpeg', .7).split(',')[1]); return (await tool('vision', {image: Array.from(b, ch => ch.charCodeAt(0)), prompt: q || 'Describe what is on this screen and point out anything important.'})).text; }\n$('scGo').onclick = async () => { $('svA').textContent = 'Choose the screen or window to share\u2026'; try { $('svA').textContent = await screenLook($('svQ').value); speak($('svA').textContent); } catch(e){ $('svA').textContent = ''; toast(e.message); } };\nconst WX = c => c === 0 ? 'clear' : c < 3 ? 'partly cloudy' : c === 3 ? 'overcast' : c < 50 ? 'foggy' : c < 60 ? 'drizzle' : c < 70 ? 'rain' : c < 80 ? 'snow' : c < 90 ? 'showers' : 'thunderstorms';\nasync function weather(city){ let lat, lon, name = city;\n  if (city) { const g = await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(city))).json(); if (!g.results) throw new Error('I could not find ' + city + '.'); ({latitude: lat, longitude: lon, name} = g.results[0]); }\n  else { const p = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, () => no(new Error('Allow location access, or say a city.')), {timeout: 8000})); lat = p.coords.latitude; lon = p.coords.longitude; name = 'your area'; }\n  const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`)).json(), c = w.current, d = w.daily;\n  return `In ${name} it is ${Math.round(c.temperature_2m)} degrees and ${WX(c.weather_code)}, feels like ${Math.round(c.apparent_temperature)}. Today's high is ${Math.round(d.temperature_2m_max[0])}, low ${Math.round(d.temperature_2m_min[0])}, with a ${d.precipitation_probability_max[0]} percent chance of rain.`; }\nasync function convert(a, f, t){ const j = await (await fetch('https://open.er-api.com/v6/latest/' + f.toUpperCase())).json(), r = j.rates && j.rates[t.toUpperCase()]; if (!r) throw new Error('I do not know those currencies.'); return `${a} ${f.toUpperCase()} is about ${(a * r).toLocaleString(undefined, {maximumFractionDigits: 2})} ${t.toUpperCase()}.`; }\nconst COINS = {bitcoin:'bitcoin', btc:'bitcoin', ethereum:'ethereum', eth:'ethereum', solana:'solana', xrp:'ripple', ripple:'ripple', dogecoin:'dogecoin', bnb:'binancecoin', litecoin:'litecoin', cardano:'cardano', tether:'tether', usdt:'tether', usdc:'usd-coin'};\nasync function coin(n, cur){ const id = COINS[n], c = (cur || 'usd').toLowerCase(), j = await (await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=${c}`)).json(); if (!j[id] || j[id][c] == null) throw new Error('I could not get that price.'); return `${n} is ${j[id][c].toLocaleString()} ${c.toUpperCase()}.`; }\nconst DESK = {whatsapp:'whatsapp://', telegram:'tg://', spotify:'spotify:', discord:'discord://', slack:'slack://', teams:'msteams:', 'microsoft teams':'msteams:', zoom:'zoommtg://', word:'ms-word:', excel:'ms-excel:', powerpoint:'ms-powerpoint:', outlook:'ms-outlook:', settings:'ms-settings:', calculator:'calculator:', vscode:'vscode://', 'visual studio code':'vscode://', 'vs code':'vscode://', steam:'steam://', skype:'skype:', clock:'ms-clock:', mail:'mailto:', camera:'microsoft.windows.camera:', photos:'ms-photos:', maps:'bingmaps:', store:'ms-windows-store:'};\nfunction openDesk(n){ const a = appList().find(x => x[0].toLowerCase() === n && String(x[1]).includes(':')), u = a ? a[1] : DESK[n]; if (!u) return false; location.href = u; return true; }\nasync function tool(op, d){ const r = await fetch('/api/tool', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(Object.assign({op}, d))}); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Switch on Workers AI first (README step 3)'); return j; }\nconst PAPER = () => (DB.paper = DB.paper || {cash: 10000, coin: 0, log: []});\nasync function luno(){ const p = $('lnP').value, t = await tool('luno', {pair: p}); const P = PAPER(), last = +t.last_trade, val = P.cash + P.coin * last;\n  $('lnO').innerHTML = `${p}: <b>${last.toLocaleString()}<\/b> (bid ${t.bid}, ask ${t.ask})<br>Paper wallet: money ${P.cash.toFixed(2)}, coins ${P.coin.toFixed(6)}, total ${val.toFixed(2)} (started 10000)`; return {p, last}; }\nasync function paperTrade(side){ try { const {p, last} = await luno(), P = PAPER(), a = parseFloat($('lnA').value);\n  if (!(a > 0)) return toast('Type an amount first'); if (side === 'buy') { if (a > P.cash) return toast('Not enough paper money'); P.cash -= a; P.coin += a / last; } else { const c = a / last; if (c > P.coin) return toast('Not enough paper coins'); P.coin -= c; P.cash += a; }\n  P.log.push({side, a, last, at: Date.now()}); persist(); toast('Paper ' + side + ' done'); luno(); } catch(e){ toast(e.message); } }\n$('lnGo').onclick = () => luno().catch(e => toast(e.message)); $('lnB').onclick = () => paperTrade('buy'); $('lnS').onclick = () => paperTrade('sell');\nasync function draw(p){ $('sdP').value = p; toast('Drawing\u2026'); try { const j = await tool('img', {prompt: p}); $('sdImg').src = 'data:image/jpeg;base64,' + j.image; $('sdImg').hidden = false; } catch(e){ toast(e.message); } }\n$('sdGo').onclick = () => draw($('sdP').value);\n$('trGo').onclick = async () => { try { $('trA').textContent = (await tool('tr', {text: $('trT').value, to: $('trL').value})).text; speak($('trA').textContent); } catch(e){ toast(e.message); } };\n$('svGo').onclick = async () => { const f = $('svF').files[0]; if (!f) return toast('Pick a picture first'); $('svA').textContent = 'Looking\u2026';\n  try { const im = await createImageBitmap(f), k = Math.min(1, 512 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);\n    const b = atob(c.toDataURL('image/jpeg', .8).split(',')[1]), arr = Array.from(b, ch => ch.charCodeAt(0)); $('svA').textContent = (await tool('vision', {image: arr, prompt: $('svQ').value || 'Describe this picture in detail.'})).text; speak($('svA').textContent); } catch(e){ $('svA').textContent = ''; toast(e.message); } };\nfunction run(raw){\n  let s = raw.toLowerCase().trim().replace(/[.,!?]+$/, ''), m;\n  logLine('You', raw); DB.thread.push({who:'me', text: raw, at: Date.now()}); armedUntil = Date.now() + 60000;\n  const open = () => DB.tasks.filter(t => !t.done).length;\n  if ((m = s.match(/^(?:draw|paint|generate an image of|make a picture of) (.+)/))) { show('studio'); speak('Drawing that now.'); draw(m[1]); return; }\n  if (/^(?:luno|bitcoin|btc|crypto) price|^price of bitcoin/.test(s)) { show('studio'); luno().then(r => speak('Bitcoin is ' + Math.round(r.last) + ' on Luno.')).catch(e => toast(e.message)); return; }\n  if (window.TEEBNative && /^(open (?!(?:my )?(?:notes?|tasks?)\\b).+|go home|go back|recents|lock screen|screenshot|scroll (up|down)|(click|tap|press) .+|type .+|read screen|what'?s on (the |my )?screen)$/.test(s)) { const r = TEEBNative.act(raw); speak(r); return; }\n  if (/^(?:open|check|show) (?:my )?(?:gmail|emails?|inbox)/.test(s)) { speak('Opening your Gmail.'); window.open('https://mail.google.com/mail/u/0/#inbox', '_blank'); return; }\n  if ((m = s.match(/^(?:email|send an email to|compose an email to|write an email to) (\\S+)(?: about (.+))?/))) { const to = m[1].includes('@') ? m[1] : ''; speak('Opening a new email.'); window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(to) + '&su=' + encodeURIComponent(m[2] || '') + '&body=' + encodeURIComponent(to ? '' : 'To: ' + m[1] + '\\n\\n'), '_blank'); return; }\n  if (!isAndroid && !window.TEEBNative .settings[k]; });\n    buildKeys(); loadMods(); $('sWake').value = DB.settings.wake || DEF_WAKE; $('sAll').checked = DB.settings.all !== false; $('sCouncil').checked = DB.settings.council !== false;\n    fillVoices(); renderAll(); speak(P().hi(who())); startRec();\n  } catch(err){ m.textContent = 'Login failed: ' + (err.message || err); }\n};\nfunction fillVoices(){ const s = $('sVoice'); s.innerHTML = speechSynthesis.getVoices().map(v => `<option ${v.name === DB.settings.voice ? 'selected' : ''}>${esc(v.name)}<\/option>`).join(''); }\nif (window.speechSynthesis) speechSynthesis.onvoiceschanged = fillVoices;\n\n/* core editor + loader hand-off */\n$('cLoad').onclick = () => { $('cCode').value = __boot.core[$('cPart').value] || ''; };\n$('cSave').onclick = async () => { const c = __boot.core, k = $('cPart').value, v = $('cCode').value;\n  if (k === 'js') { try { new Function('__boot', v); } catch(e){ return toast('Syntax error: ' + e.message); } }\n  c[k] = v; c.custom = true; toast('Saving\u2026');\n  try { const old = storage.root.children.filter(f => f.name === 'teeb-core.json'); await storage.upload('teeb-core.json', JSON.stringify(c)).complete; for (const f of old) await f.delete(true); toast('Saved. Reloading\u2026'); setTimeout(() => location.reload(), 1200); } catch(e){ toast('Save failed: ' + e.message); } };\n$('cReset').onclick = () => { if (confirm('Reset TEEB to the built-in version?')) __boot.reset(); };\n$('signOut').onclick = () => { try { localStorage.removeItem('teeb_sess'); } catch(e){} location.reload(); };\nif (typeof __boot !== 'undefined' && __boot) { megaLogin = async () => { storage = __boot.storage; await megaLoad(); }; $('lE').value = __boot.email; $('lP').value = 'x'; setTimeout(() => $('lf').requestSubmit(), 0); }\ndocument.querySelectorAll('input[type=password]').forEach(i => { const b = document.createElement('button'); b.type = 'button'; b.className = 'b'; b.textContent = 'Show'; b.onclick = () => { i.type = i.type === 'password' ? 'text' : 'password'; b.textContent = i.type === 'password' ? 'Show' : 'Hide'; }; i.after(b); });\n$('keys').insertAdjacentHTML('beforebegin', '<div class=\"g\" style=\"margin:12px 0\"><b>Stay logged in on this device<\/b><div class=\"row\" style=\"margin-top:8px\"><select id=\"stayS\"><option value=\"0\">No, ask me every time<\/option><option value=\"300000\">For 5 minutes<\/option><option value=\"3600000\">For 1 hour<\/option><option value=\"86400000\">For 1 day<\/option><option value=\"2592000000\">For 30 days<\/option><\/select><\/div><\/div>');\n(function(){ let cur = 0; try { const o = JSON.parse(localStorage.getItem('teeb_sess') || 'null'); if (o && o.exp > Date.now()) cur = o.ms || 0; } catch(e){} $('stayS').value = String(cur) in {0:1,300000:1,3600000:1,86400000:1,2592000000:1} ? String(cur) : '0';\n  $('stayS').onchange = () => { const ms = +$('stayS').value; try { if (!ms) { localStorage.removeItem('teeb_sess'); return toast('You will be asked to log in every time.'); } const st = __boot.storage; if (typeof st.toJSON !== 'function') { $('stayS').value = '0'; return toast('This MEGA library version cannot keep you logged in.'); } localStorage.setItem('teeb_sess', JSON.stringify({s: st.toJSON(), email: __boot.email, ms, exp: Date.now() + ms})); toast('Staying logged in on this device.'); } catch(e){ toast('Could not save the login.'); } }; })();\n/* updates: look for a newer TEEB and offer one new idea a day. Nothing installs without a tap. */\nfunction pop(title, msg, yes, onYes){ const d = document.createElement('div'); d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:99;padding:16px'; d.innerHTML = `<div class=\"g\" style=\"max-width:420px;background:#0b1530\"><h2 style=\"font-size:20px;color:var(--ice)\">${esc(title)}<\/h2><p style=\"margin:10px 0\">${esc(msg)}<\/p><div class=\"row\"><button class=\"b hot\" id=\"pY\">${esc(yes)}<\/button><button class=\"b\" id=\"pN\">Not now<\/button><\/div><\/div>`; document.body.appendChild(d); d.querySelector('#pN').onclick = () => d.remove(); d.querySelector('#pY').onclick = () => { d.remove(); onYes(); }; }\nasync function checkUpdates(){\n  if (typeof __boot === 'undefined' || !__boot) return; const L = k => { try { return localStorage.getItem(k); } catch(e){ return null; } }, S = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };\n  try { const j = await (await fetch('/version.json?' + Date.now())).json(); if (j.v > (__boot.core.v || 0) && Date.now() - +(L('teeb_upd') || 0) > 864e5) { S('teeb_upd', Date.now()); return pop('TEEB update ready', (j.notes || 'A new version is available.') + (__boot.core.custom ? ' Your own code edits will be replaced.' : ''), 'Update now', () => __boot.reset()); } } catch(e){}\n  if (Date.now() - +(L('teeb_idea') || 0) < 864e5) return; const ks = DB.settings.keys || {}, p = PROVIDERS.find(x => ks[x.id] || x.nokey); if (!p) return;\n  try { const o = await (p.ask || askOA)('Suggest ONE small, useful, safe feature to add to TEEB, a browser voice assistant with notes, tasks, planner, studio, apps and web search. Answer with just one sentence that starts with a verb.', {key: ks[p.id] || '', model: (DB.settings.models || {})[p.id] || p.model}, p); S('teeb_idea', Date.now()); const idea = (o.text || '').slice(0, 220); if (idea) pop('TEEB has an idea', idea, 'Build it', () => genMod(idea)); } catch(e){}\n}\nsetTimeout(checkUpdates, 6000); setInterval(checkUpdates, 6 * 36e5);\n/* boot \u2014 nothing is loaded until MEGA login succeeds */\nfillVoices(); show('home'); renderAll(); setStatus('Log in to start');\nif ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});\n"};
const $ = id => document.getElementById(id);
async function put(st, name, str){ const old = st.root.children.filter(f => f.name === name && !f.directory); await st.upload(name, str).complete; for (const f of old) await f.delete(true); }
$('lf').onsubmit = async ev => {
  ev.preventDefault(); const m = $('m'); m.textContent = 'Logging in…';
  try {
    if (!window.mega) throw new Error('Could not load the MEGA library.');
    const email = $('e').value.trim(), st = await new mega.Storage({email, password: $('p').value}).ready;
    await finish(st, email, +$('stay').value);
  } catch(err){ m.textContent = 'Login failed: ' + (err.message || err); }
};
async function finish(st, email, stayMs){
  const m = $('m');
  try {
    if (stayMs && typeof st.toJSON === 'function') { try { localStorage.setItem('teeb_sess', JSON.stringify({s: st.toJSON(), email, ms: stayMs, exp: Date.now() + stayMs})); } catch(e){} }
    else if (stayMs) m.textContent = 'This MEGA library cannot keep you logged in; logging in normally.';
    const files = st.root.children.filter(f => f.name === 'teeb-core.json' && !f.directory).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    let core = null;
    if (files[0] && !$('r').checked) { try { core = JSON.parse(new TextDecoder().decode(await files[0].downloadBuffer())); } catch(e){ core = null; } }
    if (!core || (!core.custom && (core.v || 0) < DEFAULT_CORE.v)) { core = DEFAULT_CORE; await put(st, 'teeb-core.json', JSON.stringify(core)); }
    boot(st, email, core);
  } catch(err){ m.textContent = 'Login failed: ' + (err.message || err); }
}
(async function(){ try { const o = JSON.parse(localStorage.getItem('teeb_sess') || 'null'); if (!o) return; if (o.exp < Date.now() || !window.mega || typeof mega.Storage.fromJSON !== 'function') { localStorage.removeItem('teeb_sess'); return; }
  $('m').textContent = 'Welcome back…'; const st = await mega.Storage.fromJSON(o.s).ready; await finish(st, o.email, 0); } catch(e){ try { localStorage.removeItem('teeb_sess'); } catch(x){} $('m').textContent = ''; } })();
function boot(st, email, core){
  $('ls').remove(); document.body.innerHTML = core.body;
  const s = document.createElement('style'); s.textContent = core.css; document.head.appendChild(s);
  window.__boot = {storage: st, email, core, reset: async () => { await put(st, 'teeb-core.json', JSON.stringify(DEFAULT_CORE)); location.reload(); }};
  try { new Function('__boot', core.js)(window.__boot); }
  catch(e){ document.body.innerHTML = '<p style="padding:20px;color:#fff;font:15px system-ui">TEEB failed to start: ' + e.message + '. Reload and tick “Reset TEEB to the built-in version”.</p>'; }
}
